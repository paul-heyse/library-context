# Publication choices only. Architecture/lifecycle remain with their existing owners.
[site]
repository = "https://github.com/paul-heyse/library-context"
branch = "main"
base_url = "/"

# Documentation binaries. An empty version means the latest release (presence is checked); a
# version given here is a pin and needs a docs/pins.md row with its reason.
[tools]
mdbook = ""
pagefind = ""
lychee = ""

[publication]
entrypoints = ["README.md", "docs/README.md", "docs/design/README.md", "STATUS.md", "AGENTS.md", "docs/publishing.md"]
current_work = ["docs/plans/semantic-model-cutover-plan_2026-09-29.md", "docs/plans/behavioral-model-forward-plan_2026-09-24.md", "docs/plans/semantic-model-incremental-alignment-plan_2026-10-02.md", "docs/plans/semantic-model-native-preparation-plan_2026-10-02.md", "docs/plans/semantic-model-execution-foundations-plan_2026-10-02.md", "docs/plans/semantic-model-serving-discovery-plan_2026-10-02.md"]
exclude = ["docs/external-review-postgresl-options.md", "docs/external-review-pathway-working-product.md", "docs/external-review-fully-semantic-graph-data-model.md"]
assets = []

[[collections]]
title = "Start here"
include = ["README.md", "STATUS.md", "AGENTS.md"]
scope = "Current"
[[collections]]
title = "Documentation"
include = ["docs/*.md"]
scope = "Reference"
[[collections]]
title = "Architecture"
include = ["docs/design/**/*.md"]
scope = "Current"
[[collections]]
title = "Decisions"
include = ["docs/adr/*.md"]
scope = "Reference"
[[collections]]
title = "Work plans"
include = ["docs/plans/**/*.md"]
scope = "Reference"
[[collections]]
title = "Design standard"
include = ["docs/design_review/design_principles/**/*.md"]
scope = "Current"
[[collections]]
title = "Reviews"
include = ["docs/design_review/reviews/**/*.md"]
scope = "Reference"
[[collections]]
title = "Evidence"
include = ["docs/design_review/evidence/**/README.md"]
scope = "Reference"
[[collections]]
title = "Process"
include = [".claude/skills/README.md", ".claude/skills/adr/*.md", ".claude/skills/design-review/*.md", ".claude/skills/design-review-code-intelligence/*.md", ".claude/skills/handoff/*.md", ".claude/skills/pin-check/*.md", ".claude/agents/*.md"]
scope = "Current"
[[collections]]
title = "Libraries"
include = ["libraries/README.md"]
scope = "Reference"
