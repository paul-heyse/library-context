[profile.default]
fail-fast = false
status-level = "fail"
final-status-level = "slow"
# Report slow tests at 60 s; terminate at 360 s. Overrides below carry longer budgets.
slow-timeout = { period = "60s", terminate-after = 6 }

# Every default run leaves a reviewable report at target/nextest/default/junit.xml
# (overwritten per run). Full per-test output for passes and failures comes from
# nextest's record store, enabled in the user config (`cargo nextest store list`).
[profile.default.junit]
path = "junit.xml"
store-failure-output = true

# This cumulative behavioral journey compiles multiple native frontiers and replays their
# scoped domain controls. Allow time for the complete journey under concurrent execution.
[[profile.default.overrides]]
filter = 'test(behavioral_terminal_frontiers_retain_scoped_basis_and_unknown_twins)'
slow-timeout = { period = "60s", terminate-after = 15 }

# This new Catalog journey also publishes, takes two exact backups, creates a foreign
# search view and independently restores/audits fresh ownership before cleanup.
[[profile.default.overrides]]
filter = 'test(=selected_backup_restores_fresh_ownership_while_foreign_window_binding_coexists)'
slow-timeout = { period = "60s", terminate-after = 15 }

# Operator-approved orchestration allowance for generated analysis, independent
# admission, publication, native queries and cleanup. Not a performance acceptance limit.
[[profile.default.overrides]]
filter = 'test(=current_catalog_analysis_links_public_native_operations_and_original_evidence)'
slow-timeout = { period = "60s", terminate-after = 15 }

# These compound controls include actual producer/normalization or complete source
# retirement before their independent semantic/receiving assertions. The earlier
# 360s orchestration timeout interrupted those phases; it is not a performance gate.
# Phase-captured Base execution completed providers and normalization and continued
# admission until cancellation; its short observed retries do not establish a stall.
# Paired-layout controls retain both compiles; each case/profile has its own result.
# Native query/effect/resource limits and functional assertions remain unchanged.
[[profile.default.overrides]]
filter = 'test(=base_execution::behavioral_execution_channels_preserve_evaluation_completion_calls_and_enrichment) | test(=scoped_source_execution::actual_source_calls_and_enriched_match_finite_whole_operation) | test(workspace_batching_) | test(=facts_backup_cold_concurrent_restores_preserve_originals_and_fresh_ownership) | test(scoped_summary::actual_summary_matches_complete_finite_whole_operation) | test(scoped_summary::actual_recursive_summary_preserves_scc_delta_answers_and_exhaustion) | test(summary_publication::catalog_summaries_are_explicitly_not_requested) | test(typed_types::inherited_fields_refer_to_the_declaring_artifact_and_ignore_method_assignments)'
slow-timeout = { period = "60s", terminate-after = 15 }

# Independently selectable frontier/profile admission and export controls retain their
# original orchestration allowance.
[[profile.default.overrides]]
filter = 'test(/::(catalog|behavioral)_(facts|normalized|analysis|catalog)_admits_and_exports_exact_originals$/)'
slow-timeout = { period = "60s", terminate-after = 15 }
