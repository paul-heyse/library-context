# End-of-turn pipeline (scripts/after_turn.py, ADR-0110). Every step is a just recipe, and every
# step is automatic: the hooks run no `just hygiene` check and fix nothing. Keys before any [table].

# At stop, synchronously, in order.
sync = ["skills-sync", "adr-index", "build-features", "fmt"]
# In the background job; failed steps are shown to the operator.
ready = ["images-ready", "doctor-check"]
# After the job, one run per burst of stops; nothing waits on them.
after = ["library-catalog"]
# Seconds before a hung step is killed.
step_timeout = 1200

# Run a sync step when current inputs differ from its last successful refresh, including commits.
[sync_when]
build-features = ["Cargo.lock", "**/Cargo.toml", ".config/hakari.toml"]
