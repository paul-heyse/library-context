# ADR-0136: Cargo unifies features for every selection; Hakari materializes the CLI union.
hakari-package = "lctx-workspace-hack"
dep-format-version = "4"
resolver = "2"
platforms = ["x86_64-unknown-linux-gnu"]
unify-target-host = "none"
exact-versions = true

# Attach the union at the executable boundary. Lower libraries and native bindings
# must not gain compiler, DataFusion, or test-only dependencies through the hack.
# Cargo's workspace resolver still unifies their existing dependencies' features.
[final-excludes]
workspace-members = [
  "cpg-flow", "cpg-core", "cpg-extract", "lctx-analytics", "lctx-embed",
  "lctx-model", "lctx-model-macros", "lctx-semantics", "lctx-eval",
  "lctx-surrealdb", "lctx-publisher", "lctx-serving",
]
# ADR-0118: keep the embedded registry family inside the Pyrefly adapter.
# Latest Ruff/ty share their exact git source; never unify features across family identities.
third-party = [
  { name = "ruff_source_file", version = "=0.0.14" },
  { name = "ruff_text_size", version = "=0.0.14" },
]
