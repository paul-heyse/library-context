[project]
name = "lctx-mcp"
version = "0.1.0"
description = "The capability server: FastMCP over one pinned serving generation (DESIGN §11)."
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.0.5",
    "pyarrow==25.0.1",
    "numpy==2.4.6",
    "httpx==0.28.1",
    "bm25s==0.3.11",
    # Used directly (the holistic assessment's A7), and locked through fastmcp.
    "pydantic==2.13.5",
    "mcp-types==2.2.0",
]

[project.scripts]
lctx-mcp = "lctx_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
