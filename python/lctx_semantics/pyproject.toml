[project]
name = "lctx-semantics"
version = "0.1.0"
description = "Pinned Rust semantic query kernel for lctx-mcp."
requires-python = ">=3.14,<3.15"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "lctx_semantics._native"
python-source = "python"

# The build environment supplies a content/membership key for these same declared files.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../uv.lock" },
    { file = "../../rust-toolchain.toml" },
    { file = "../../.cargo/config.toml" },
    { file = "../../scripts/build_environment.py" },
    { file = "../../crates/lctx-model/Cargo.toml" },
    { file = "../../crates/lctx-model/build.rs" },
    { file = "../../crates/lctx-model/src/**/*.rs" },
    { file = "../../crates/lctx-model/models/**/*.toml" },
    { file = "../../crates/lctx-model-macros/Cargo.toml" },
    { file = "../../crates/lctx-model-macros/src/**/*.rs" },
    { file = "../../crates/lctx-surrealdb/Cargo.toml" },
    { file = "../../crates/lctx-surrealdb/src/**/*.rs" },
    { file = "../../crates/lctx-serving/Cargo.toml" },
    { file = "../../crates/lctx-serving/src/**/*.rs" },
    { env = "LCTX_NATIVE_SEMANTICS_INPUTS" },
]
