[project]
name = "lctx-storage"
version = "0.1.0"
description = "Rust-owned asynchronous PostgreSQL serving services."
requires-python = ">=3.14,<3.15"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "lctx_storage._storage"
python-source = "python"
