# Review F1 (ADR-0012): Pyrefly treats its state as unsupported after any panic, so the extractor
# must abort the attempt rather than catch a panic and continue with the next module. Slice-1
# review O2: a scoped thread per module catches a panic the same way, so it is flagged too.
# The Stage 2 review's O3: the flow provider (ty, salsa) runs inside the extraction under the same
# policy.
id: no-catch-unwind-in-extractor
language: rust
severity: error
message: catch_unwind in the extractor would continue after a Pyrefly panic
note: Any panic in analyzer-touching code (Pyrefly, ty) aborts the extraction (DESIGN §4.2.5).
rule:
  all:
    - not:
        pattern: std::panic::catch_unwind(AssertUnwindSafe(|| provider.run(&mut context)))
    - any:
        - pattern: catch_unwind($$$ARGS)
        - pattern: panic::catch_unwind($$$ARGS)
        - pattern: std::panic::catch_unwind($$$ARGS)
        - pattern: thread::scope($$$ARGS)
        - pattern: std::thread::scope($$$ARGS)
files:
  - crates/cpg-extract/src/**/*.rs
  - crates/cpg-flow/src/**/*.rs

# The exact whole-provider boundary above is fail-stop: context.close(Err) closes its outputs,
# the driver poisons StageOutput and waits for provider state release, then fails the attempt.
# It never catches per-module analysis or reuses native state after a panic (bundle panic control).
