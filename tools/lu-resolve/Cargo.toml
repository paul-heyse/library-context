[package]
name = "lu-resolve"
version = "0.0.0"
edition = "2024"
publish = false
description = "Library utilization catalog, stage S2: resolve workspace references to library items with rust-analyzer's semantic layer (no build)."

# Its own workspace: the ra_ap_* family is 0.0.x, semver-breaking every release and pinned exactly,
# on the toolchain the rust-code-model skill pins. It must not join the product workspace or its
# dependency-family checks.
[workspace]

[dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.151"
ra_ap_base_db = "=0.0.352"
ra_ap_hir = "=0.0.352"
ra_ap_ide_db = "=0.0.352"
ra_ap_load-cargo = "=0.0.352"
ra_ap_paths = "=0.0.352"
ra_ap_project_model = "=0.0.352"
ra_ap_syntax = "=0.0.352"
ra_ap_vfs = "=0.0.352"
