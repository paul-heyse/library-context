[package]
edition = "2024"
rust-version = "1.85"
name = "surrealkit"
version = "1.0.0-beta.1"
authors = [
    "Chiru Boggavarapu <chiru@foretag.co>",
    "Tobie Morgan Hitchcock <tobie@surrealdb.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Manage migrations, seeding, typegen and tests for SurrealDB via CLI"
homepage = "https://github.com/surrealdb/surrealkit"
documentation = "https://docs.rs/surrealkit"
readme = "README.md"
keywords = [
    "surrealdb",
    "migrations",
    "seed",
    "testing",
    "manage",
]
categories = [
    "database",
    "command-line-utilities",
    "development-tools",
]
license = "Apache-2.0"
repository = "https://github.com/surrealdb/surrealkit"
resolver = "2"

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"

[features]
cli = [
    "dep:clap",
    "dep:inquire",
    "dep:rustls",
    "dep:tempfile",
]
default = [
    "kv-mem",
    "cli",
]
embedded = [
    "kv-surrealkv",
    "kv-rocksdb",
    "kv-mem",
]
kv-mem = ["surrealdb/kv-mem"]
kv-rocksdb = ["surrealdb/kv-rocksdb"]
kv-surrealkv = ["surrealdb/kv-surrealkv"]

[lib]
