[package]
name = "lctx-native"
description = "Shared native codec, control, installation, selected access and transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
blake3.workspace = true
toml.workspace = true

[dependencies]
lctx-model = { path = "../lctx-model" }
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-grpc", "protocol-http", "rustls"] }
surrealdb-protocol = "=0.13.1"
prost = "=0.14.4"
surrealdb-syn.workspace = true
surrealdb-sql.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
hex.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[dev-dependencies]
datafusion.workspace = true
lctx-compiler-store = { path = "../lctx-compiler-store" }
tracing-subscriber.workspace = true
insta.workspace = true
tonic = { version = "=0.14.6", features = ["transport"] }


# Used by scripts/producer_fingerprint.rs included through build.rs's #[path],
# outside cargo-shear's package-local scan.
[package.metadata.cargo-shear]
ignored = ["blake3", "toml"]

[lints]
workspace = true
