# Pydantic 2.13.5 TypeAdapter validates against a schema selected by its instance. Successful
# output may transform the object; custom validators may add effects or raise. The current
# validate(schema) channel requires a named schema, so this model withholds that effect rather
# than mislabeling the dynamic schema as TypeAdapter itself.
[[models]]
phase = "call"
revision = 1
target = { scope = "dependency", distribution = "pydantic", version = "2.13.5", module = "pydantic.type_adapter", callable = "TypeAdapter.validate_python" }
coverage = { transfers = "partial", effects = "unspecified", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "object" }
to = { kind = "return_value" }
transfer = "transform"
modality = "potential"

# Synchronous class protocols, CPython 3.14.7 Lib/contextlib.py (ADR-0059).
# These assert runtime behavior of the exact class after admitted constructor arguments;
# they are not synthetic provider __enter__/__exit__ call observations.
[[context_protocols]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "contextlib", callable = "nullcontext" }
allocation = { scope = "stdlib", python = "3.14.7", module = "builtins", callable = "object.__new__" }
initialization = { scope = "stdlib", python = "3.14.7", module = "contextlib", callable = "nullcontext.__init__" }
entry = { kind = "argument_or_none", formal = "enter_result" }
exit = { kind = "preserve" }

[[context_protocols]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "contextlib", callable = "suppress" }
allocation = { scope = "stdlib", python = "3.14.7", module = "builtins", callable = "object.__new__" }
initialization = { scope = "stdlib", python = "3.14.7", module = "contextlib", callable = "suppress.__init__" }
entry = { kind = "none_value" }
exit = { kind = "suppress_classes", formal = "exceptions" }
