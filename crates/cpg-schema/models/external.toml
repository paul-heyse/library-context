version = 1

# `typing.cast` returns its value unchanged at runtime. The annotated type is not a value source.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "typing", callable = "cast" }
coverage = { transfers = "complete", effects = "complete", callbacks = "complete", resources = "complete", exceptions = "complete" }
normal_return = true

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "val" }
to = { kind = "return_value" }
transfer = "identity"
modality = "definite"

# Python 3.14 typing.assert_type is a static checker directive. At runtime it performs no
# check and returns val unchanged (CPython Doc/library/typing.rst, pinned context binding).
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "typing", callable = "assert_type" }
coverage = { transfers = "complete", effects = "complete", callbacks = "complete", resources = "complete", exceptions = "complete" }
normal_return = true

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "val" }
to = { kind = "return_value" }
transfer = "identity"
modality = "definite"

# Python 3.14 print() writes text to a stream (sys.stdout by default, or file.write).
# The stream identity is call-dependent, so this model claims the I/O effect without a subject.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "builtins", callable = "print" }
coverage = { transfers = "unspecified", effects = "partial", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "effect"
effect = { kind = "io_write" }
modality = "potential"

# json.dumps serializes obj to a str. A custom encoder/default can add other effects, so
# effect and callback coverage stay open. The output's dependence on obj is potential.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "json", callable = "dumps" }
coverage = { transfers = "partial", effects = "partial", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "obj" }
to = { kind = "return_value" }
transfer = "transform"
modality = "potential"

[[models.rules]]
kind = "effect"
effect = { kind = "serialize", format = "json" }
subject = { kind = "parameter", name = "obj" }
modality = "potential"

# json.dump writes serialized text to fp; it neither owns nor closes the passed stream.
# A custom encoder/default leaves the rest of its effects open.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "json", callable = "dump" }
coverage = { transfers = "unspecified", effects = "partial", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "effect"
effect = { kind = "serialize", format = "json" }
subject = { kind = "parameter", name = "obj" }
modality = "potential"

[[models.rules]]
kind = "effect"
effect = { kind = "io_write" }
subject = { kind = "parameter", name = "fp" }
modality = "potential"

# json.loads can decode str/bytes/bytearray. Decoder classes and parse/object hooks are
# caller-supplied, so this is a potential data dependence, not a total/pure result model.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "json", callable = "loads" }
coverage = { transfers = "partial", effects = "unspecified", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "s" }
to = { kind = "return_value" }
transfer = "transform"
modality = "potential"

# gzip.compress returns compressed bytes from data on a normal path. Type, level and memory
# failures leave normal completion open; this effect is tied to the source data, not file I/O.
[[models]]
revision = 1
target = { scope = "stdlib", python = "3.14.7", module = "gzip", callable = "compress" }
coverage = { transfers = "partial", effects = "partial", callbacks = "unspecified", resources = "unspecified", exceptions = "unspecified" }

[[models.rules]]
kind = "transfer"
from = { kind = "parameter", name = "data" }
to = { kind = "return_value" }
transfer = "transform"
modality = "potential"

[[models.rules]]
kind = "effect"
effect = { kind = "compress", format = "gzip" }
subject = { kind = "parameter", name = "data" }
modality = "potential"

