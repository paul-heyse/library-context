[package]
name = "lctx-publisher"
description = "Private native loading, reconciliation and immutable graph publication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
lctx-model = { path = "../lctx-model" }
lctx-surrealdb = { path = "../lctx-surrealdb" }
cpg-core = { path = "../cpg-core" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tempfile.workspace = true
futures.workspace = true
[dev-dependencies]
cpg-extract = { path = "../cpg-extract" }
datafusion.workspace = true
surrealdb-protocol = "=0.13.1"
tonic = { version = "=0.14.6", features = ["transport"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tokio.workspace = true
tempfile.workspace = true
[lints]
workspace = true

# Used by the shared catalog_runtime.rs fixture included from cpg-core tests.
[package.metadata.cargo-shear]
ignored = ["cpg-extract", "datafusion"]
# backup.rs includes this test module through an explicit #[path].
ignored-paths = ["tests/fixtures/grpc_export.rs"]
