[package]
name = "lctx-publisher"
description = "Private native loading, reconciliation and immutable graph publication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[build-dependencies]
blake3.workspace = true
toml.workspace = true
[dependencies]
lctx-model = { path = "../lctx-model" }
lctx-native = { path = "../lctx-native" }
lctx-compiler-store = { path = "../lctx-compiler-store" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tempfile.workspace = true
futures.workspace = true
surrealdb-syn.workspace = true
surrealdb-sql.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
[dev-dependencies]
tracing-subscriber.workspace = true
cpg-core = { path = "../cpg-core" }
cpg-extract = { path = "../cpg-extract" }
datafusion.workspace = true
surrealdb-protocol = "=0.13.1"
tonic = { version = "=0.14.6", features = ["transport"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tempfile.workspace = true
[lints]
workspace = true

# Build dependencies are used by #[path]-included scripts/producer_fingerprint.rs;
# datafusion is used by shared cpg-core test fixtures. Both are outside the local scan.
[package.metadata.cargo-shear]
ignored = ["blake3", "toml", "datafusion"]
# backup.rs and native_publication.rs include these fixture modules through #[path].
ignored-paths = ["tests/fixtures/grpc_export.rs", "tests/fixtures/publication_expectations.rs"]
