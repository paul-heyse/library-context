[package]
name = "lctx-serving"
description = "Native graph operation execution and bounded semantic packet assembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lctx-model = { path = "../lctx-model" }
lctx-native = { path = "../lctx-native" }
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-grpc", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hex.workspace = true
moka = { version = "=0.12.16", default-features = false, features = ["future"] }

[dev-dependencies]
lctx-tracing = { path = "../lctx-tracing" }
tracing-subscriber.workspace = true
futures.workspace = true
lctx-compiler-store = { path = "../lctx-compiler-store" }
tracing.workspace = true
datafusion.workspace = true
cpg-core = { path = "../cpg-core" }
cpg-extract = { path = "../cpg-extract" }
lctx-publisher = { path = "../lctx-publisher" }
tempfile.workspace = true

[lints]
workspace = true

# Used by the shared catalog_runtime.rs and native.rs fixtures included from cpg-core tests.
[package.metadata.cargo-shear]
ignored = ["datafusion", "futures", "tracing-subscriber"]
