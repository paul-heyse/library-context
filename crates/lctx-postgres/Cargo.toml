[package]
name = "lctx-postgres"
description = "Bounded PostgreSQL effects for compilation and serving, without compiler dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sea-query.workspace = true
getrandom.workspace = true
schemars.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
pgvector.workspace = true
pgpq.workspace = true
bytes.workspace = true
url.workspace = true
lctx-model = { path = "../lctx-model" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
testcontainers-modules = { workspace = true, optional = true }

[features]
# Disposable PostgreSQL 18 databases for tests in this and dependent crates.
testing = ["dep:testcontainers-modules"]

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
testcontainers-modules.workspace = true
lctx-postgres = { path = ".", features = ["testing"] }

[lints]
workspace = true
