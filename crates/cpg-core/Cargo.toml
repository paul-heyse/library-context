tracing.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[build-dependencies]
blake3.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# Both build dependencies are used by the #[path]-included shared fingerprint source
