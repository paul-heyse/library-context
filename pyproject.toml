[project]
name = "library-context-dev"
version = "0.0.0"
description = "Dev-only Python: repo scripts and their tests. No product Python in stage 1."
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.5",
    "vllm>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.7",
    "pyrefly==1.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
addopts = ["--strict-markers", "--strict-config", "-q"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py314"
# fixtures/python is input data for the analyzers, not code we maintain.
extend-exclude = ["fixtures", ".claude/skills", "target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["scripts", "tests"]
project-excludes = ["fixtures/**", ".claude/**", "**/target/**"]
search-path = ["scripts"]
