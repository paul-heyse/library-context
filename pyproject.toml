[project]
name = "library-context-dev"
version = "0.0.0"
description = "The uv workspace root: repo scripts, their tests and the dev tools. Product Python is a member (ADR-0010)."
requires-python = ">=3.14"
# The members, so the root environment runs their tests and type-checks them. vLLM is served from
# its own locked project (services/vllm), never from here.
dependencies = ["lctx-mcp"]

[tool.uv.workspace]
members = ["python/lctx_mcp"]

[tool.uv.sources]
lctx-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.7",
    "pyrefly==1.3.1",
    "hypothesis==6.168.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/scripts", "python/lctx_mcp/tests"]
addopts = ["--strict-markers", "--strict-config", "-q"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["scripts", "python/lctx_mcp/src"]
target-version = "py314"
# Fixtures are analyzer input; docs contain archived probes and illustrative code fences.
extend-exclude = ["fixtures", ".claude/skills", "target", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["scripts", "tests", "python/lctx_mcp/src", "python/lctx_mcp/tests"]
project-excludes = ["fixtures/**", ".claude/**", "**/target/**"]
# The server's source is a project file, not a site package: its editable install puts it on the
# interpreter's site path, which pyrefly excludes (increment-1 deep review F6).
search-path = ["scripts", "python/lctx_mcp/src"]
site-package-path = [".venv/lib/python3.14/site-packages"]
