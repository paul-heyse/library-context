[project]
name = "library-context-dev"
version = "0.0.0"
description = "The uv workspace root: repo scripts, their tests and the dev tools. Product Python is a member (ADR-0010)."
requires-python = ">=3.14"
# The members, so the root environment runs their tests and type-checks them. vLLM is served from
# its own locked project (services/vllm), never from here.
dependencies = ["lctx-mcp", "lctx-semantics"]

[tool.uv.workspace]
members = ["python/lctx_mcp", "python/lctx_semantics"]

[tool.uv.sources]
lctx-mcp = { workspace = true }
lctx-semantics = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    # Exact: the CLI is the parity oracle for the linked native Pyrefly (docs/pins.md, Analyzers).
    "pyrefly==1.4.0.dev3",
    # Exact: the version the python-oracles library skill indexes (docs/pins.md, Serving).
    "hypothesis==6.168.1",
    "fastmcp==4.0.5",
    # Independent original-evidence comparison baseline only; product search is native.
    "bm25s==0.3.12",
]

[tool.uv]
package = false
# Declared dependencies are pinned exactly (DESIGN §7); `uv add` writes `==`.
add-bounds = "exact"

[tool.pytest.ini_options]
testpaths = ["tests/scripts", "python/lctx_mcp/tests"]
addopts = ["--strict-markers", "--strict-config", "-q"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["scripts", "python/lctx_mcp/src"]
target-version = "py314"
# Fixtures are analyzer input; docs contain archived probes and illustrative code fences.
# `libraries/` and `services/` are separate uv projects with their own environments.
extend-exclude = ["fixtures", ".claude/skills", "target", "docs", "libraries", "services"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["scripts", "tests", "python/lctx_mcp/src", "python/lctx_mcp/tests"]
project-excludes = ["fixtures/**", ".claude/**", "**/target/**"]
# The server's source is a project file, not a site package: its editable install puts it on the
# interpreter's site path, which pyrefly excludes (increment-1 deep review F6).
search-path = ["scripts", "tests/scripts", "python/lctx_mcp/src", "python/lctx_mcp/tests"]
site-package-path = [".venv/lib/python3.14/site-packages"]
