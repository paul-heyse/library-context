  source = ["server/providers/aggregate.py:71-88", "server/providers/aggregate.py:166-176", "server/server.py:342"]

  [[question.item]]
  id = "Q12.f"
  polarity = "positive"
  claim = "An unresolved name raises NotFoundError('Unknown tool: ...') in FastMCP.call_tool, and the tools/call handler turns it into a CallToolResult with is_error=True and the text Unknown tool: 'N', not a JSON-RPC error."
  source = ["server/server.py:1513-1514", "server/mixins/mcp_operations.py:245-258"]

  [[question.item]]
  id = "Q12.g"
  polarity = "negative"
  claim = "Providers are consulted in registration order and the first one returning a match wins, even when a later provider has a higher version (the add_provider docstring says so, but the lookup takes the highest version)."
  source = ["server/providers/aggregate.py:156-181", "server/providers/aggregate.py:198-206", "server/server.py:698-712"]
