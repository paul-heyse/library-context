[[question]]
id = "Q01"
text = "What happens to each option of `@mcp.tool(...)` (fastmcp.FastMCP.tool): which options reach the registered Tool unchanged, which are transformed or defaulted, which are consumed by the decorator itself, and which combinations raise at registration?"
kind = "controls"
operations = ["fastmcp.FastMCP.tool"]
stage = 3

  [[question.item]]
  id = "Q01.a"
  polarity = "positive"
  claim = "title, icons, timeout, auth and run_in_thread reach the resulting FunctionTool unchanged (FastMCP.tool -> LocalProvider.tool -> ToolMeta -> LocalProvider.add_tool -> Tool.from_function -> FunctionTool fields)."
  source = ["server/server.py:1951-1966", "server/providers/local_provider/decorators/tools.py:302-320", "server/providers/local_provider/decorators/tools.py:138-153", "tools/function_tool.py:348-367"]
  docs = ["servers/tools.mdx#Decorator Arguments"]

  [[question.item]]
  id = "Q01.b"
  polarity = "positive"
  claim = "version is transformed: a non-None version (str or int) is stored on the Tool as str(version)."
  source = ["tools/function_tool.py:352"]
  docs = ["servers/tools.mdx#Decorator Arguments"]

  [[question.item]]
  id = "Q01.c"
  polarity = "positive"
  claim = "task=None is replaced by the server's constructor default FastMCP(tasks=...) (False when tasks is unset); a bool is then normalized to TaskConfig(mode='optional') for True and TaskConfig(mode='forbidden') for False, while a TaskConfig is kept as given."
  source = ["server/server.py:347", "server/server.py:1962", "tools/function_tool.py:325-332", "utilities/tasks.py:55-58"]
  docs = ["servers/tasks.mdx#Server-Wide Default"]

  [[question.item]]
  id = "Q01.d"
  polarity = "positive"
  claim = "app is consumed by FastMCP.tool itself and not forwarded: app=True sets meta['ui']=True, an AppConfig or dict is converted with app_config_to_meta_dict into meta['ui'] (on a copy of meta), and app=None or app=False adds nothing."
  source = ["server/server.py:1942-1948", "server/server.py:1951-1966"]

  [[question.item]]
  id = "Q01.e"
  polarity = "positive"
  claim = "Combining timeout with run_in_thread=False on a sync function (neither a coroutine function nor an async generator function) raises ValueError at registration."
  source = ["tools/function_tool.py:305-323"]
  docs = ["servers/tools.mdx#Thread affinity"]

  [[question.item]]
  id = "Q01.f"
  polarity = "positive"
  claim = "A task-enabled mode on a sync function raises ValueError at registration ('... uses a sync function but has task execution enabled'), including when the mode comes only from the server default FastMCP(tasks=True)."
  source = ["tools/function_tool.py:333", "utilities/tasks.py:64-83", "server/server.py:1962"]
  docs = ["servers/tasks.mdx#Enabling Background Tasks", "servers/tasks.mdx#Server-Wide Default"]

  [[question.item]]
  id = "Q01.g"
  polarity = "negative"
  claim = "An annotations dict passed to @mcp.tool is stored on the Tool as a plain dict (it is in fact converted with ToolAnnotations(**annotations))."
  source = ["server/providers/local_provider/decorators/tools.py:268-269"]

[[question]]
id = "Q02"
text = "When I register a function as a tool, which of its parameters become the tool's input schema, which are injected by FastMCP and hidden from the schema, and which parameter kinds are rejected at registration?"
kind = "execution"
operations = ["fastmcp.FastMCP.tool", "fastmcp.FastMCP.add_tool", "fastmcp.tools.Tool.from_function"]
stage = 5

  [[question.item]]
  id = "Q02.a"
  polarity = "positive"
  claim = "A positional-only parameter makes registration fail with ValueError, because MCP passes tool arguments by name."
  source = ["tools/function_parsing.py:283-294", "tools/function_tool.py:299"]

  [[question.item]]
  id = "Q02.b"
  polarity = "positive"
  claim = "A *args parameter makes registration fail with ValueError ('Functions with *args are not supported as tools')."
  source = ["tools/function_parsing.py:295-296"]
  docs = ["servers/tools.mdx#The `@tool` Decorator"]

  [[question.item]]
  id = "Q02.c"
  polarity = "positive"
  claim = "A **kwargs parameter makes registration fail with ValueError ('Functions with **kwargs are not supported as tools')."
  source = ["tools/function_parsing.py:297-300"]
  docs = ["servers/tools.mdx#The `@tool` Decorator"]

  [[question.item]]
  id = "Q02.d"
  polarity = "positive"
  claim = "A parameter annotated as Context (with default None it gets the optional form) is given a CurrentContext()/OptionalCurrentContext() dependency default, excluded from the input schema, and filled with the active Context at call time."
  source = ["server/dependencies.py:321-328", "server/dependencies.py:374-377", "server/dependencies.py:692-709", "tools/function_parsing.py:332-340"]
  docs = ["servers/context.mdx#Legacy Type-Hint Injection", "servers/dependency-injection.mdx#How Dependency Injection Works"]

  [[question.item]]
  id = "Q02.e"
  polarity = "positive"
  claim = "A parameter whose default is a Dependency (e.g. Depends(fn)) is excluded from the input schema, and a caller-supplied argument with that parameter's name is filtered out before dependency resolution."
  source = ["server/dependencies.py:692-709", "server/dependencies.py:864-868"]
  docs = ["servers/tools.mdx#Hiding Parameters from the LLM"]

  [[question.item]]
  id = "Q02.f"
  polarity = "positive"
  claim = "All remaining parameters form the input schema: a pydantic TypeAdapter is built over the wrapper signature with injected parameters removed, its JSON schema is compressed (titles pruned), and docstring parameter descriptions are added to properties that have no description yet."
  source = ["tools/function_parsing.py:335-352"]
  docs = ["servers/tools.mdx#Docstring Descriptions"]

  [[question.item]]
  id = "Q02.g"
  polarity = "negative"
  claim = "Context injection is triggered by the parameter's name (e.g. a parameter called ctx) rather than by its Context type annotation."
  source = ["server/dependencies.py:321-328"]
  docs = ["servers/context.mdx#Legacy Type-Hint Injection"]

[[question]]
id = "Q03"
text = "Does `FastMCP(tasks=True)` make every tool task-capable (including tools passed via `FastMCP(tools=[...])` or `add_tool`), and where and when does `strict_input_validation` actually take effect?"
kind = "configuration"
operations = ["fastmcp.FastMCP", "fastmcp.FastMCP.tool", "fastmcp.FastMCP.add_tool"]
stage = 3

  [[question.item]]
  id = "Q03.a"
  polarity = "positive"
  claim = "FastMCP(tasks=...) is stored as _support_tasks_by_default and is read only by FastMCP.tool, as the default when the decorator's task argument is None."
  source = ["server/server.py:347", "server/server.py:1962"]

  [[question.item]]
  id = "Q03.b"
  polarity = "positive"
  claim = "Tools registered through FastMCP(tools=[...]) or add_tool(fn) never consult the server's tasks= default: a plain function is built with task=None, which becomes TaskConfig(mode='forbidden'), and a standalone-@tool function keeps its own task setting (None resolves to False)."
  source = ["server/server.py:460-464", "server/server.py:1817-1829", "server/providers/local_provider/decorators/tools.py:118-125", "server/providers/local_provider/decorators/tools.py:154-155", "tools/function_tool.py:325-328"]

  [[question.item]]
  id = "Q03.c"
  polarity = "negative"
  claim = "FastMCP(tasks=True) enables background-task support for tools added via FastMCP(tools=[...]) or add_tool() (the docs describe it as a default for all tools, but only @mcp.tool reads it)."
  source = ["server/server.py:1962", "server/server.py:460-464"]
  docs = ["servers/tasks.mdx#Server-Wide Default"]

  [[question.item]]
  id = "Q03.d"
  polarity = "positive"
  claim = "strict_input_validation is resolved once in FastMCP.__init__ (the constructor argument, else fastmcp.settings.strict_input_validation) into the public attribute FastMCP.strict_input_validation."
  source = ["server/server.py:466-470"]
  docs = ["servers/server.mdx#Behavior"]

  [[question.item]]
  id = "Q03.e"
  polarity = "positive"
  claim = "The flag takes effect at call time: FunctionTool.run reads the _current_context ContextVar and passes strict=True to pydantic's validate_python only when the active Context's server has strict_input_validation set; with no active Context (e.g. calling tool.run() directly) strict is None, i.e. lax coercion."
  source = ["tools/function_tool.py:124-138", "tools/function_tool.py:389", "tools/function_tool.py:474-483"]

  [[question.item]]
  id = "Q03.f"
  polarity = "positive"
  claim = "Because FastMCP.call_tool always enters Context(fastmcp=self) and a mounted tool is executed by the child's call_tool, a mounted child's tools are validated under the child server's strict_input_validation, not the parent's."
  source = ["server/server.py:1437", "server/providers/fastmcp_provider.py:78-99", "server/context.py:273-279", "tools/function_tool.py:135-138"]

  [[question.item]]
  id = "Q03.g"
  polarity = "negative"
  claim = "strict_input_validation is enforced by the MCP SDK validating arguments against the tool's JSON input schema (it is pydantic strict mode in FunctionTool)."
  source = ["tools/function_tool.py:467-483"]
  docs = ["servers/tools.mdx#Validation Modes"]

[[question]]
id = "Q04"
text = "Which FASTMCP_* settings change FastMCP's behaviour, and when is each one read: at import, as a snapshot when a server or client is constructed, or on each call? Which declared settings are never read?"
kind = "settings"
operations = ["fastmcp.settings"]
stage = 2

  [[question.item]]
  id = "Q04.a"
  polarity = "positive"
  claim = "FASTMCP_* environment variables (and the .env file named by FASTMCP_ENV_FILE) are read once, when fastmcp is imported and fastmcp.settings = Settings() is created; later environment changes have no effect, whereas assignments to fastmcp.settings attributes are validated and seen by any later read."
  source = ["__init__.py:20", "settings.py:19", "settings.py:37-44"]
  docs = ["more/settings.mdx"]

  [[question.item]]
  id = "Q04.b"
  polarity = "positive"
  claim = "log_enabled, log_level, enable_rich_tracebacks and enable_rich_logging configure the fastmcp logger at import time, and deprecation_warnings installs the FastMCPDeprecationWarning filter at import time."
  source = ["__init__.py:20-25", "__init__.py:40-41", "utilities/logging.py:56-83"]

  [[question.item]]
  id = "Q04.c"
  polarity = "positive"
  claim = "mask_error_details, strict_input_validation and client_log_level are snapshotted in FastMCP.__init__ when the matching constructor argument is None; client_init_timeout and client_disconnect_timeout are snapshotted in Client.__init__."
  source = ["server/server.py:373-378", "server/server.py:466-476", "client/client.py:501-504", "client/client.py:582"]

  [[question.item]]
  id = "Q04.d"
  polarity = "positive"
  claim = "transport and show_server_banner (run_async); host, port, stateless_http, http_host_origin_protection, http_allowed_hosts and log_level (run_http_async); and json_response, streamable_http_path, sse_path, message_path, debug, http_allowed_origins and http_session_idle_timeout (http_app) are read on every call, as fallbacks when the corresponding argument is None."
  source = ["server/mixins/transport.py:87-90", "server/mixins/transport.py:299-326", "server/mixins/transport.py:417-467"]
  docs = ["more/settings.mdx#Transport & HTTP"]

  [[question.item]]
  id = "Q04.e"
  polarity = "positive"
  claim = "mcp_camelcase_compat is read on every bridged camelCase attribute access and telemetry_mode on every telemetry_mode() resolution, so assigning them at runtime takes effect immediately."
  source = ["_compat.py:119-124", "telemetry.py:86-100"]

  [[question.item]]
  id = "Q04.f"
  polarity = "positive"
  claim = "server_dependencies has no attribute read in the fastmcp or fastmcp_tasks packages, and mounted_components_raise_on_load_error is not read anywhere in the fastmcp package: its only read is in fastmcp_tasks, which re-raises when collecting task components fails."
  source = ["settings.py:270-273", "settings.py:299-310", "../fastmcp_tasks/lifespan.py:54-60"]
  docs = ["more/settings.mdx#Advanced", "more/settings.mdx#Error Handling"]

  [[question.item]]
  id = "Q04.g"
  polarity = "negative"
  claim = "It is statically certain that server_dependencies is never read at runtime (Settings.get_setting/set_setting access settings by string name, as utilities.tests.temporary_settings does, so the absence of attribute reads does not prove it)."
  source = ["settings.py:46-70", "utilities/tests.py:35-65"]

[[question]]
id = "Q05"
text = "When a tool raises, what does a `fastmcp.Client` caller see, and what changes it: `mask_error_details` vs `FASTMCP_MASK_ERROR_DETAILS`, raising `ToolError`, the tool's own `timeout`, mounted child servers, and `Client.call_tool(raise_on_error=...)` vs `call_tool_mcp`?"
kind = "exceptions"
operations = ["fastmcp.FastMCP", "fastmcp.FastMCP.call_tool", "fastmcp.FastMCP.mount", "fastmcp.Client.call_tool", "fastmcp.Client.call_tool_mcp"]
stage = 3

  [[question.item]]
  id = "Q05.a"
  polarity = "positive"
  claim = "An exception that is not a FastMCPError (and not an httpx 429, an httpx timeout, or a missing-client-capability MCPError) is converted by FastMCP.call_tool into a ToolError whose message is Error calling tool '<name>': <exception text>, or just Error calling tool '<name>' when masking is on."
  source = ["server/server.py:1544-1577"]
  docs = ["servers/tools.mdx#Error Handling"]

  [[question.item]]
  id = "Q05.b"
  polarity = "positive"
  claim = "The masking flag is FastMCP(mask_error_details=...) when given, otherwise fastmcp.settings.mask_error_details (FASTMCP_MASK_ERROR_DETAILS) captured at construction; changing the setting after the server is built does not change that server."
  source = ["server/server.py:373-378"]
  docs = ["servers/server.mdx#Behavior", "more/settings.mdx#Error Handling"]

  [[question.item]]
  id = "Q05.c"
  polarity = "positive"
  claim = "A ToolError, or any FastMCPError such as an argument ValidationError, raised under a tool is re-raised unchanged, so its message reaches the client even with masking on; the tools/call handler returns it as a CallToolResult with is_error=True and the message as text."
  source = ["server/server.py:1518-1533", "server/mixins/mcp_operations.py:259-267"]
  docs = ["servers/tools.mdx#Error Handling"]

  [[question.item]]
  id = "Q05.d"
  polarity = "positive"
  claim = "A tool's own timeout raises MCPError(code=-32000, 'Tool ... execution timed out after Ns'), which FastMCP.call_tool's generic handler converts into a ToolError and masks like any other exception; the client receives an is_error tool result (Client.call_tool raises ToolError), not a JSON-RPC error."
  source = ["tools/function_tool.py:414-430", "server/server.py:1544-1577", "server/mixins/mcp_operations.py:259-267"]

  [[question.item]]
  id = "Q05.e"
  polarity = "positive"
  claim = "A mounted child's tool errors are masked according to the child's own mask_error_details (the child's call_tool performs the conversion) and the parent re-raises the resulting ToolError unchanged; mount() only logs a warning when the parent masks and the child does not."
  source = ["server/providers/fastmcp_provider.py:78-99", "server/server.py:1529-1533", "server/server.py:2376-2383"]

  [[question.item]]
  id = "Q05.f"
  polarity = "positive"
  claim = "Client.call_tool with raise_on_error=True (default) raises fastmcp.exceptions.ToolError carrying the first TextContent text of an is_error result; with raise_on_error=False, or through call_tool_mcp, the is_error result is returned instead of raised."
  source = ["client/mixins/tools.py:281-338", "client/mixins/tools.py:367-373", "client/mixins/tools.py:418-424", "client/mixins/tools.py:146-253"]
  docs = ["clients/tools.mdx#Error Handling"]

  [[question.item]]
  id = "Q05.g"
  polarity = "negative"
  claim = "When a tool exceeds its timeout, the client receives a JSON-RPC/MCP protocol error with code -32000 (raised as MCPError)."
  source = ["server/server.py:1544-1577"]
  docs = ["servers/tools.mdx#Timeouts"]

[[question]]
id = "Q06"
text = "Which calls reach a middleware's `on_call_tool`, in what order are middleware run, and what does `call_next` ultimately execute?"
kind = "callbacks"
operations = ["fastmcp.FastMCP.add_middleware", "fastmcp.server.middleware.Middleware.on_call_tool", "fastmcp.FastMCP.call_tool"]
stage = 5

  [[question.item]]
  id = "Q06.a"
  polarity = "positive"
  claim = "A wire tools/call request reaches on_call_tool: the registered tools/call handler calls FastMCP.call_tool with its default run_middleware=True, which runs the middleware chain with method 'tools/call'."
  source = ["server/mixins/mcp_operations.py:121", "server/mixins/mcp_operations.py:236-246", "server/server.py:1438-1473", "server/middleware/middleware.py:175-176"]

  [[question.item]]
  id = "Q06.b"
  polarity = "positive"
  claim = "A direct programmatic await mcp.call_tool(...) also runs the middleware chain unless run_middleware=False is passed."
  source = ["server/server.py:1389-1396", "server/server.py:1438"]

  [[question.item]]
  id = "Q06.c"
  polarity = "positive"
  claim = "Calling a mounted child's tool through the parent runs the parent's chain and then the child's own chain, because FastMCPProviderTool._run calls child.call_tool(...) with the default run_middleware=True."
  source = ["server/providers/fastmcp_provider.py:78-99"]
  docs = ["servers/middleware.mdx#Server Composition"]

  [[question.item]]
  id = "Q06.d"
  polarity = "positive"
  claim = "The chain wraps self.middleware in reverse, so the first entry is outermost (first in, last out); constructor middleware come first, DereferenceRefsMiddleware is appended when dereference_schemas=True, and add_middleware() appends after it, so middleware added later runs inside DereferenceRefsMiddleware."
  source = ["server/server.py:494", "server/server.py:502-507", "server/server.py:586-597", "server/server.py:623-624"]
  docs = ["servers/middleware.mdx#Execution Order"]

  [[question.item]]
  id = "Q06.e"
  polarity = "positive"
  claim = "Within one Middleware instance a tools/call is handled as on_message -> on_request -> on_call_tool."
  source = ["server/middleware/middleware.py:160-202"]
  docs = ["servers/middleware.mdx#Hooks"]

  [[question.item]]
  id = "Q06.f"
  polarity = "positive"
  claim = "The innermost call_next is the registered extensions' tools/call interceptors (first-registered outermost) around self.call_tool(context.message.name, context.message.arguments or {}, version=<the original call's version>, run_middleware=False), i.e. tool lookup plus tool._run; rewriting context.message.name or arguments changes what runs, but the version is taken from the original call."
  source = ["server/server.py:1463-1473", "server/server.py:678-696", "server/server.py:1479-1517"]

  [[question.item]]
  id = "Q06.g"
  polarity = "negative"
  claim = "Middleware added with add_middleware() after construction runs outside (before) the automatically added DereferenceRefsMiddleware."
  source = ["server/server.py:502-507", "server/server.py:623-624"]

[[question]]
id = "Q07"
text = "When does the `lifespan=` passed to `FastMCP` run, how many times, in what order relative to providers and extensions, and how does the value it yields reach a tool?"
kind = "lifecycle"
operations = ["fastmcp.FastMCP", "fastmcp.Context.lifespan_context"]
stage = 5

  [[question.item]]
  id = "Q07.a"
  polarity = "positive"
  claim = "FastMCP() only stores the lifespan; it runs when _lifespan_manager is entered: by run_stdio_async or run_http_async, by the HTTP app's lifespan (the streamable-HTTP session manager through _lifespan_proxy, or the SSE app directly), or by an in-memory Client connection through FastMCPTransport."
  source = ["server/server.py:427-434", "server/server.py:274-294", "server/mixins/transport.py:239", "server/mixins/transport.py:357", "server/http.py:525-528", "server/http.py:683-687", "client/transports/memory.py:87", "client/transports/memory.py:118-134"]

  [[question.item]]
  id = "Q07.b"
  polarity = "positive"
  claim = "_lifespan_manager is reference-counted: nested or concurrent entries reuse the running result, and when the count drops to 0 the cached result is cleared, so a later entry (e.g. a second, sequential in-memory Client connection) runs the lifespan again."
  source = ["server/mixins/lifespan.py:168-187", "server/mixins/lifespan.py:213-222"]

  [[question.item]]
  id = "Q07.c"
  polarity = "positive"
  claim = "Entry order is: user lifespan, then SharedContext/server ContextVar setup, then extension lifespans in registration order, then each provider's lifespan in registration order (LocalProvider first; mounted servers via FastMCPProvider.lifespan), then task-extension validation; teardown runs in reverse through an AsyncExitStack shielded from cancellation."
  source = ["server/mixins/lifespan.py:189-216", "server/server.py:364-368"]

  [[question.item]]
  id = "Q07.d"
  polarity = "positive"
  claim = "The user lifespan's yielded value is stored as FastMCP._lifespan_result and returned by Context.lifespan_context; when that is None, lifespan_context falls back to the request context's lifespan_context, or {} when there is no request context."
  source = ["server/mixins/lifespan.py:195-200", "server/context.py:417-451"]
  docs = ["servers/lifespan.mdx#Accessing Lifespan Context"]

  [[question.item]]
  id = "Q07.e"
  polarity = "positive"
  claim = "A Lifespan created with @lifespan turns a None yield into {}, and the default lifespan (no lifespan= given) yields {}."
  source = ["server/lifespan.py:77-92", "server/server.py:261-271"]

  [[question.item]]
  id = "Q07.f"
  polarity = "positive"
  claim = "In a mounted child's tool, ctx.lifespan_context returns the child's own lifespan result, not the parent's: the child's lifespan runs inside the parent's provider lifespans via FastMCPProvider.lifespan and populates the child's _lifespan_result."
  source = ["server/providers/fastmcp_provider.py:581-613", "server/context.py:418-442"]

  [[question.item]]
  id = "Q07.g"
  polarity = "negative"
  claim = "A server's lifespan runs exactly once per process, no matter how many times the server is started or how many clients connect one after another."
  source = ["server/mixins/lifespan.py:218-222"]
  docs = ["servers/lifespan.mdx"]

[[question]]
id = "Q08"
text = "What protocol must code follow to use a `fastmcp.Client`: how is a connection opened and reused, what does `auto_initialize` do, what happens if a request is made before connecting, and what does `close()` do?"
kind = "lifecycle"
operations = ["fastmcp.Client", "fastmcp.Client.initialize", "fastmcp.Client.close"]
stage = 5

  [[question.item]]
  id = "Q08.a"
  polarity = "positive"
  claim = "A connection is opened with async with client: __aenter__ calls _connect, which on first entry starts a background asyncio task running _session_runner and waits for its ready event."
  source = ["client/client.py:948-952", "client/client.py:954-985", "client/client.py:1108-1131"]
  docs = ["clients/client.mdx#Connection Lifecycle"]

  [[question.item]]
  id = "Q08.b"
  polarity = "positive"
  claim = "The client is reentrant: each successful _connect increments nesting_counter, each exit decrements it, and the session is stopped only when the counter reaches 0."
  source = ["client/client.py:1048", "client/client.py:1066-1106"]

  [[question.item]]
  id = "Q08.c"
  polarity = "positive"
  claim = "With auto_initialize=True (default) the connection runs protocol negotiation on entry according to mode; negotiation exceeding init_timeout (default fastmcp.settings.client_init_timeout) raises RuntimeError('Failed to initialize server session'); with auto_initialize=False, initialize() must be called explicitly."
  source = ["client/client.py:501-506", "client/client.py:827-831", "client/client.py:837-889", "client/client.py:891-946"]
  docs = ["clients/client.mdx#Connection Lifecycle"]

  [[question.item]]
  id = "Q08.d"
  polarity = "positive"
  claim = "Making a request (e.g. call_tool or list_tools) before entering the client raises RuntimeError('Client is not connected. Use the 'async with client:' context manager first.') from the Client.session property."
  source = ["client/client.py:650-658", "client/mixins/tools.py:204-224", "client/mixins/tools.py:71-74"]

  [[question.item]]
  id = "Q08.e"
  polarity = "positive"
