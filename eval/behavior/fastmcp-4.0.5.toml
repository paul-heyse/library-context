# Exit rules, one per stage, pre-registered (increment 3's deep review, F5). A
# stage's items are its questions' items. "Claimed" means the served answer
# states the negative item. The assessment applies the rule as written; the
# operator reviews the assessment.

[[exit]]
stage = 2
rule = "Passes when, over the stage-2 questions (Q04, Q10, Q21-Q24): no positive item is rated incorrect or misleading; no negative item is claimed; and at least half of the positive items are present or partial. Fails otherwise."

[[exit]]
stage = 3
rule = "Passes when, over the stage-3 questions: no positive item is rated incorrect or misleading; no negative item is claimed; and at least half of the positive items are present or partial. Fails otherwise."

[[exit]]
stage = 5
rule = "Passes when, over the stage-5 questions: no positive item is rated incorrect or misleading; no negative item is claimed; and at least half of the positive items are present or partial. Fails otherwise."
