  [[question.item]]
  id = "Q12.b"
  polarity = "positive"
  claim = "Resolution goes through FastMCP.get_tool: server-level transforms wrap an auth-checked AggregateProvider lookup that queries every provider's get_tool concurrently and returns the highest version; ties (e.g. two unversioned tools) go to the provider registered first, and the LocalProvider is always registered first."
  source = ["server/server.py:942-994", "server/server.py:911-940", "server/providers/base.py:158-185", "server/providers/aggregate.py:156-181", "server/providers/aggregate.py:198-206", "server/server.py:359-368"]
