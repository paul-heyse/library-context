# cargo-deny policy (`just deps` checks bans and sources; licences are never a rejection reason,
# so the license list below is informational).
#
# The pinned-family single-version rule (DESIGN §7) is NOT here: it lives in
# scripts/check_family.py, which reads Cargo.lock directly. cargo-deny could do
# it (0.20.2 does catch dev-only duplicates with `multiple-versions-include-dev`,
# corrected 2026-09-23 by the library-leverage review), but only for crates it is
# told by name: the family is 78 crates today, and an upgrade adds sub-crates a
# name list would miss. The script's patterns cover them (ADR-0118).

[graph]
all-features = false

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
# A git dependency is an exact pin: its reason is a docs/pins.md row (ADR-0125). The forks below
# stay listed as documentation.
unknown-git = "allow"
allow-git = [
    # Owned DF55 provider and bounded pool patch (ADR-0068).
    "https://github.com/paul-heyse/datafusion-table-providers",
    # Native analyzer forks (ADR-0117/0118).
    "https://github.com/paul-heyse/pyrefly",
    "https://github.com/paul-heyse/ruff",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # libcst in the independently pinned Ruff lint analyzer.
    "PSF-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Pyrefly 1.3.1's dependency graph (ADR-0012 spike S1).
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "BSL-1.0",
    # DataFusion and its dependencies (cpg-core).
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

# Independent FCA oracle is a dev dependency only.
[[licenses.exceptions]]
name = "odis"
allow = ["AGPL-3.0-only"]

[licenses.private]
ignore = true
