# cargo-deny policy: allowed sources (crates.io plus only the pinned delta-rs
# and kernel git repos) and licenses.
#
# The pinned-family single-version rule (DESIGN §7) is NOT here: it lives in
# scripts/check_family.py, which reads Cargo.lock directly, because
# cargo-deny 0.20.2 does not see duplicates that enter only through workspace
# dev-dependencies (checked 2026-09-22).

[graph]
all-features = false

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/delta-io/delta-rs",
    "https://github.com/buoyant-data/delta-kernel-rs",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[licenses.private]
ignore = true
