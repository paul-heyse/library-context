# cargo-deny policy: allowed sources (crates.io plus only the pinned delta-rs
# and kernel git repos) and licenses.
#
# The pinned-family single-version rule (DESIGN §7) is NOT here: it lives in
# scripts/check_family.py, which reads Cargo.lock directly. cargo-deny could do
# it (0.20.2 does catch dev-only duplicates with `multiple-versions-include-dev`,
# corrected 2026-09-23 by the library-leverage review), but only for crates it is
# told by name: the family is 78 crates today, and an upgrade adds sub-crates a
# name list would miss. The script's patterns cover them (ADR-0002 amendment).

[graph]
all-features = false

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/delta-io/delta-rs",
    "https://github.com/buoyant-data/delta-kernel-rs",
    # Pyrefly fork (ADR-0012) and the lsp-types fork Pyrefly depends on.
    "https://github.com/paul-heyse/pyrefly",
    "https://github.com/yangdanny97/lsp-types",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Pyrefly 1.3.1's dependency graph (ADR-0012 spike S1).
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "BSL-1.0",
    # delta-rs and DataFusion as normal dependencies (cpg-core).
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true
